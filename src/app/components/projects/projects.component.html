<h1 class="text-glow-light text-center my-5">PROJECTS</h1>
<div class="container h-auto w-100 mb-5">
    <div class="display rounded rounded-5 w-100 p-3 p-md-4 flex-column-reverse flex-md-row">
        <div class="display__left-div w-md-50 w-100">
            <div class="project-fade" [class.fade-out]="isFading">
                <div class="title d-flex align-items-center">
                    <h2>{{ index + 1 | number : '2.0-0'}}</h2>
                    <div>
                        <h3 [class]="`text-${project.color}`">{{ project.title }}</h3>
                        <div class="project-tags">
                            <span *ngFor="let tag of project.tags" class="project-tag">{{ tag }}</span>
                        </div>
                    </div>
                </div>
                <div class="content mt-3 mt-md-4">
                    <p class="text-light p-2 h5">
                        {{project.description}}
                    </p>
                </div>
                <div class="project-bottom">
                    <div class="d-flex w-100 justify-content-center gap-3 flex-wrap tech-icons">
                        <div class="tech-icon" *ngFor="let icon of project.icons" [title]="iconLabel(icon)">
                            <img [src]="iconSrc(icon)" [alt]="iconLabel(icon)">
                        </div>
                    </div>
                    <div class="footer px-2">
                        <img class="git rounded rounded-3" (click)="open(project.link)"
                            src="assets/images/github.png" alt="Open on GitHub" title="Open on GitHub">
                    </div>
                </div>
            </div>
        </div>
        <div class="right-div w-100 w-md-50">
            <div class="top-container w-100 p-0 p-md-0">
                <img class="d-block mx-auto project-preview" [class.fade-out]="isFading"
                    [src]="`assets/images/${project.img}.png`" [alt]="project.title">
            </div>
            <div class="w-100 mt-3 d-flex justify-content-center" data-bs-theme="dark">
                <ul class="pagination pagination-lg mb-0">
                    <li class="page-item me-3">
                        <button [class]="`page-link text-${project.color}`" (click)="prev()" [disabled]="index === 0"
                            aria-label="Previous project">&laquo;</button>
                    </li>
                    <li class="page-item">
                        <button [class]="`page-link text-${project.color}`" (click)="next()"
                            [disabled]="index === projects.length - 1" aria-label="Next project">&raquo;</button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
